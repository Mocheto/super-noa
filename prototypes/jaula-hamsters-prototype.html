<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTIPO — jaula de hamsters (#407)</title>
<!-- PROTOTIPO DESECHABLE para la ticket #407 de Mocheto/super-noa.
     Pregunta: cómo se ve y se comporta la jaula. Variantes con ?variante=A|B|C o con las flechas. -->
<style>
  :root { --bg:#f4ead8; --ink:#3b2f25; --accent:#e8875b; --hud:#fff8ec; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#241e1a; --ink:#f3e8d8; --accent:#f0a07a; --hud:#3a322c; } }
  :root[data-theme="dark"] { --bg:#241e1a; --ink:#f3e8d8; --accent:#f0a07a; --hud:#3a322c; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family: system-ui, "Trebuchet MS", sans-serif; }
  #wrap { height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:8px; box-sizing:border-box; }
  svg#escena { width:min(100vw - 16px, 1040px); height:auto; max-height:78vh; border-radius:18px; box-shadow:0 8px 24px rgba(0,0,0,.18); }
  #controles { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .btn { font:inherit; font-size:15px; padding:9px 14px; border-radius:14px; border:2px solid var(--ink); background:var(--hud); color:var(--ink); cursor:pointer; }
  .btn:active { transform:scale(.97); }
  #aviso { min-height:22px; font-size:16px; text-align:center; }
  #barra { position:fixed; bottom:10px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:10px; background:#2b2b2b; color:#fff; padding:6px 12px; border-radius:999px; box-shadow:0 4px 16px rgba(0,0,0,.35); font-size:14px; z-index:10; }
  #barra button { background:#474747; color:#fff; border:0; border-radius:999px; width:34px; height:34px; font-size:16px; cursor:pointer; }
  #barra span { min-width:200px; text-align:center; }
  .ham { transition: transform .9s cubic-bezier(.3,.6,.4,1), opacity .4s; }
  .ham .cuerpo { transform-origin: 35px 40px; }
  .ham.anda .cuerpo { animation: saltito .42s ease-in-out infinite alternate; }
  .ham.come .cabeza { animation: come .5s ease-in-out infinite alternate; transform-origin: 56px 34px; }
  .ham.sale { animation: salto .5s ease-out; }
  @keyframes saltito { from { transform: translateY(0); } to { transform: translateY(-3px); } }
  @keyframes come { from { transform: translateY(0) rotate(0); } to { transform: translateY(4px) rotate(18deg); } }
  @keyframes salto { 0% { transform-origin: 35px 56px; } 40% { filter: brightness(1.08); } 100% { } }
  .rueda-gira { animation: gira 1.2s linear infinite; transform-origin: 0 0; }
  @keyframes gira { to { transform: rotate(360deg); } }
  .columpio-vaiven { animation: vaiven 1.4s ease-in-out 2 alternate; transform-origin: 0 0; }
  @keyframes vaiven { from { transform: rotate(-12deg); } to { transform: rotate(12deg); } }
  .puerta-abre { transition: transform .5s ease; transform-origin: 0 0; }
  .corazon { animation: sube 1.1s ease-out forwards; }
  @keyframes sube { from { opacity:1; transform: translateY(0); } to { opacity:0; transform: translateY(-40px); } }
  .escondido { opacity: 0 !important; }
  .flecha { animation: pulso .9s ease-in-out infinite alternate; }
  @keyframes pulso { from { transform: translateX(0); } to { transform: translateX(-8px); } }
  .burbuja { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 700; }
</style>
</head>
<body>
<div id="wrap">
  <svg id="escena" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Jaula de hamsters y habitación"></svg>
  <div id="controles">
    <button class="btn" id="btnAbrir">Abrir la puerta</button>
    <button class="btn" id="btnComida">Poner comida</button>
    <button class="btn" id="btnAgua">Rellenar agua</button>
  </div>
  <div id="aviso"></div>
</div>
<div id="barra">
  <button id="prev" aria-label="Anterior">←</button>
  <span id="etiqueta"></span>
  <button id="next" aria-label="Siguiente">→</button>
</div>

<script>
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("escena");
const $ = (s) => document.querySelector(s);

// ---- Disposiciones (coordenadas del escenario 960×540) ----
const VARIANTES = {
  A: { nombre: "Tubos arriba",
       objetos: { tubo1:{x:70,y:130,w:250}, tubo2:{x:90,y:200,w:200}, tubo3:{x:150,y:270,w:150},
                  rueda:{x:430,y:310}, columpio:{x:600,y:150}, casita:{x:790,y:300} },
       cama:{x:380,y:420}, rascador:{x:560,y:300} },
  B: { nombre: "Columpio en la jaula",
       objetos: { tubo1:{x:70,y:300,w:250}, tubo2:{x:90,y:360,w:200}, tubo3:{x:150,y:420,w:150},
                  rueda:{x:190,y:150}, columpio:{x:410,y:130}, casita:{x:800,y:190} },
       cama:{x:380,y:420}, rascador:{x:600,y:280} },
  C: { nombre: "Tubos por el suelo",
       objetos: { tubo1:{x:390,y:470,w:200}, tubo2:{x:600,y:430,w:160}, tubo3:{x:790,y:390,w:140},
                  rueda:{x:440,y:150}, columpio:{x:650,y:110}, casita:{x:820,y:200} },
       cama:{x:380,y:170}, rascador:{x:560,y:260} }
};
const TUBO_COLOR = ["#e35d52", "#4d8bdc", "#f2c64c"];
const NOMBRE = { tubo1:"Tubo rojo", tubo2:"Tubo azul", tubo3:"Tubo amarillo", rueda:"Rueda", columpio:"Columpio", casita:"Casita" };
const SONIDO = { tubo1:"¡uy!", tubo2:"¡uy!", tubo3:"¡uy!", rueda:"tic tic tic", columpio:"¡hala!", casita:"shhh…" };

// ---- Estado ----
let variante = "A";
let comida = 100, agua = 100;           // porcentajes
let puertaAbierta = false;
const hams = [
  { id:"perla", nombre:"Perla", color:"#b9793f", vientre:"#fff6ea", escala:1,    x:110, y:330, tx:null, ty:null, dir:1, hambre:60, sed:60, estado:"jaula", oculto:false, escapadoAt:0, pista:null },
  { id:"bolita", nombre:"Bolita", color:"#9a9ea6", vientre:"#f4f4f6", escala:0.86, x:230, y:380, tx:null, ty:null, dir:1, hambre:60, sed:60, estado:"jaula", oculto:false, escapadoAt:0, pista:null }
];
const PUERTA = { x: 340, y: 230 };     // hueco de la puerta de la jaula (borde derecho)
const JAULA = { x0: 50, x1: 330, y0: 90, y1: 440 };
const HABITACION = { x0: 370, x1: 940, y0: 40, y1: 500 };

// ---- Utilidades SVG ----
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
function aviso(t) {
  const a = document.getElementById("aviso"); a.textContent = t;
  clearTimeout(aviso.t); aviso.t = setTimeout(() => a.textContent = "", 2400);
}
function corazonEn(x, y) {
  const t = el("text", { x, y, "font-size": 26, class: "corazon" }, capas.efectos);
  t.textContent = "♥"; setTimeout(() => t.remove(), 1200);
}
function burbujaEn(x, y, txt) {
  const g = el("g", {}, capas.efectos);
  const r = el("rect", { x: x - 60, y: y - 34, width: 120, height: 30, rx: 12, fill: "#fff", stroke: "#3b2f25", "stroke-width": 2 }, g);
  const t = el("text", { x, y: y - 13, "text-anchor": "middle", class: "burbuja", fill: "#3b2f25" }, g);
  t.textContent = txt;
  setTimeout(() => g.remove(), 1400);
}

// ---- Dibujos ----
function dibujaFondo() {
  el("rect", { x:0, y:0, width:960, height:540, fill:"#f8efdc" }, capas.fondo);
  // papel pintado de rayas
  for (let x = 370; x < 960; x += 40) el("rect", { x, y:0, width:14, height:400, fill:"#efe2c8", opacity:.7 }, capas.fondo);
  // suelo
  el("rect", { x:0, y:470, width:960, height:70, fill:"#d9b98a" }, capas.fondo);
  el("rect", { x:0, y:466, width:960, height:6, fill:"#c3a074" }, capas.fondo);
  // ventana
  el("rect", { x:830, y:60, width:100, height:120, rx:6, fill:"#bfe3f2", stroke:"#c8a373", "stroke-width":8 }, capas.fondo);
  el("line", { x1:880, y1:60, x2:880, y2:180, stroke:"#c8a373", "stroke-width":5 }, capas.fondo);
  // cama
  const c = VARIANTES[variante].cama;
  el("ellipse", { cx:c.x+55, cy:c.y+30, rx:70, ry:28, fill:"#e7a6a0", stroke:"#c97f78", "stroke-width":3 }, capas.fondo);
  el("ellipse", { cx:c.x+55, cy:c.y+22, rx:54, ry:16, fill:"#f6d6cf" }, capas.fondo);
  // rascador
  const r = VARIANTES[variante].rascador;
  el("rect", { x:r.x, y:r.y, width:44, height:170, rx:8, fill:"#bf9b6a" }, capas.fondo);
  for (let y = r.y + 10; y < r.y + 170; y += 14) el("line", { x1:r.x, x2:r.x+44, y1:y, y2:y+6, stroke:"#9d7b4f", "stroke-width":3 }, capas.fondo);
  el("rect", { x:r.x-16, y:r.y+166, width:76, height:14, rx:6, fill:"#8d6b43" }, capas.fondo);
}

function dibujaJaula() {
  // suelo de la jaula con virutas
  el("rect", { x:JAULA.x0-6, y:JAULA.y0-6, width:JAULA.x1-JAULA.x0+12, height:JAULA.y1-JAULA.y0+12, rx:16, fill:"#c9a36e", stroke:"#8a6f4d", "stroke-width":8 }, capas.jaula);
  el("rect", { x:JAULA.x0+4, y:JAULA.y0+4, width:JAULA.x1-JAULA.x0-8, height:JAULA.y1-JAULA.y0-8, rx:10, fill:"#e6cf9d" }, capas.jaula);
  for (let x = JAULA.x0+30; x < JAULA.x1; x += 52) el("circle", { cx:x, cy:JAULA.y1-30, r:6, fill:"#d1b57e" }, capas.jaula);
  // barrotes
  for (let x = JAULA.x0+30; x < JAULA.x1; x += 36) el("rect", { x:x-3, y:JAULA.y0-6, width:6, height:JAULA.y1-JAULA.y0+12, fill:"#8a6f4d", opacity:.45 }, capas.jaula);
  // comedero y bebedero (los dibuja la capa de sitio, se redibujan)
  el("ellipse", { cx:85, cy:JAULA.y1-40, rx:34, ry:12, fill:"#d5cdbb", stroke:"#9b9280", "stroke-width":3 }, capas.jaula);
  if (comida > 0) for (let i = 0; i < 9; i++) el("circle", { cx:62+i*6, cy:JAULA.y1-44+((i%3)*3), r:4, fill:"#e9b26b" }, capas.jaula);
  // bebedero
  el("rect", { x:JAULA.x1-40, y:JAULA.y0+30, width:28, height:70, rx:12, fill:"#f2f8fb", stroke:"#9bb9c7", "stroke-width":3 }, capas.jaula);
  el("rect", { x:JAULA.x1-36, y:JAULA.y0+30+70*(1-agua/100), width:20, height:70*(agua/100), rx:6, fill:"#7fbfe0" }, capas.jaula);
  el("rect", { x:JAULA.x1-28, y:JAULA.y0+22, width:12, height:12, fill:"#9bb9c7" }, capas.jaula);
  // puerta (se gira al abrirla)
  const p = el("g", { id:"puertaG", transform:`translate(${PUERTA.x},${PUERTA.y})` }, capas.jaula);
  el("rect", { x:-6, y:0, width:12, height:90, rx:6, fill:"var(--accent)", fill:"#e8875b", stroke:"#b65e35", "stroke-width":2 }, p);
  const pg = el("g", { id:"puertaHoja", class:"puerta-abre", transform: puertaAbierta ? "rotate(-70)" : "rotate(0)" }, p);
  el("rect", { x:-6, y:0, width:12, height:90, rx:6, fill:"#e8875b", stroke:"#b65e35", "stroke-width":2 }, pg);
  el("circle", { cx:2, cy:45, r:3, fill:"#fff" }, pg);
}

function dibujaObjetos() {
  const o = VARIANTES[variante].objetos;
  for (const [id, p] of Object.entries(o)) {
    const g = el("g", { class:"objeto", "data-id":id, transform:`translate(${p.x},${p.y})`, style:"cursor:pointer" }, capas.objetos);
    g.addEventListener("click", () => jugar(id));
    if (id.startsWith("tubo")) {
      const color = TUBO_COLOR[+id.slice(-1)-1];
      el("rect", { x:0, y:0, width:p.w, height:24, rx:12, fill:color, stroke:"#fff", "stroke-opacity":.5, "stroke-width":3 }, g);
      el("rect", { x:10, y:5, width:p.w-30, height:5, rx:3, fill:"#fff", opacity:.45 }, g);
      el("circle", { cx:0, cy:12, r:12, fill:color, stroke:"#fff", "stroke-opacity":.5, "stroke-width":3 }, g);
      el("circle", { cx:p.w, cy:12, r:12, fill:color, stroke:"#fff", "stroke-opacity":.5, "stroke-width":3 }, g);
    } else if (id === "rueda") {
      const rg = el("g", { class:"rueda-gira", id:"rueda" }, g);
      el("circle", { cx:55, cy:55, r:52, fill:"none", stroke:"#8a6f4d", "stroke-width":10 }, g);
      el("circle", { cx:55, cy:55, r:52, fill:"none", stroke:"#e35d52", "stroke-width":4, "stroke-dasharray":"30 30" }, rg);
      for (let a = 0; a < 6; a++) el("line", { x1:55, y1:55, x2:55+46*Math.cos(a*Math.PI/3), y2:55+46*Math.sin(a*Math.PI/3), stroke:"#c59b64", "stroke-width":4 }, rg);
      el("rect", { x:40, y:110, width:30, height:10, rx:4, fill:"#8a6f4d" }, g);
    } else if (id === "columpio") {
      el("line", { x1:4, y1:110, x2:4, y2:0, stroke:"#8a6f4d", "stroke-width":6 }, g);
      el("line", { x1:116, y1:110, x2:116, y2:0, stroke:"#8a6f4d", "stroke-width":6 }, g);
      el("line", { x1:4, y1:6, x2:116, y2:6, stroke:"#8a6f4d", "stroke-width":6 }, g);
      const sw = el("g", { class:"columpio-vaiven", id:"columpio" }, g);
      el("line", { x1:30, y1:8, x2:30, y2:60, stroke:"#9a9a9a", "stroke-width":2 }, sw);
      el("line", { x1:90, y1:8, x2:90, y2:60, stroke:"#9a9a9a", "stroke-width":2 }, sw);
      el("rect", { x:26, y:60, width:68, height:12, rx:6, fill:"#f2c64c", stroke:"#c99b1f", "stroke-width":2 }, sw);
    } else if (id === "casita") {
      el("rect", { x:0, y:40, width:120, height:70, fill:"#e7b27c", stroke:"#b9824e", "stroke-width":4 }, g);
      el("polygon", { points:"-8,44 60,0 128,44", fill:"#d1644f", stroke:"#a4442f", "stroke-width":4, "stroke-linejoin":"round" }, g);
      el("path", { d:"M44 110 L44 80 Q60 66 76 80 L76 110 Z", fill:"#7a4e2d" }, g);
      el("rect", { x:86, y:56, width:20, height:20, rx:4, fill:"#bfe3f2", stroke:"#b9824e", "stroke-width":3 }, g);
    }
    // etiqueta pequeña
    const t = el("text", { x:(p.w||60)/2 || 60, y:(id.startsWith("tubo") ? -6 : -6), "text-anchor":"middle", "font-size":13, fill:"#6b5a48", opacity:.8 }, g);
    t.textContent = NOMBRE[id];
  }
}

function dibujaEscondites() {
  // Hace que los escondites sean tocables (cama y rascador)
  const v = VARIANTES[variante];
  const cama = el("rect", { x:v.cama.x-10, y:v.cama.y-10, width:150, height:70, fill:"transparent", style:"cursor:pointer" }, capas.objetos);
  cama.addEventListener("click", () => esconderseEn("cama"));
  const rasc = el("rect", { x:v.rascador.x-20, y:v.rascador.y, width:84, height:190, fill:"transparent", style:"cursor:pointer" }, capas.objetos);
  rasc.addEventListener("click", () => esconderseEn("rascador"));
}

function hamsterSVG(h) {
  const g = el("g", { id:h.id, class:"ham", style:"cursor:grab" }, capas.hams);
  const f = el("g", { class:"flip" }, g);
  const s = el("g", { transform:`scale(${h.escala})` }, f);
  el("ellipse", { cx:12, cy:32, rx:6, ry:5, fill:h.vientre }, s);                   // cola
  el("g", { class:"cuerpo" }, s).appendChild(el("ellipse", { cx:35, cy:40, rx:24, ry:16, fill:h.color }));
  const cuerpo = s.querySelector(".cuerpo");
  el("ellipse", { cx:35, cy:45, rx:15, ry:9, fill:h.vientre }, cuerpo);            // vientre
  el("ellipse", { cx:28, cy:52, rx:6, ry:3.5, fill:h.color }, s);                   // patas
  el("ellipse", { cx:42, cy:52, rx:6, ry:3.5, fill:h.color }, s);
  const cab = el("g", { class:"cabeza" }, s);
  el("circle", { cx:56, cy:28, r:15, fill:h.color }, cab);
  el("circle", { cx:50, cy:14, r:7, fill:h.color }, cab);                            // orejas
  el("circle", { cx:64, cy:16, r:6, fill:h.color }, cab);
  el("circle", { cx:50, cy:14, r:4, fill:"#f2b3a8" }, cab);
  el("circle", { cx:64, cy:16, r:3.5, fill:"#f2b3a8" }, cab);
  el("ellipse", { cx:58, cy:36, rx:6, ry:4, fill:h.vientre, opacity:.9 }, cab);     // carrillo
  el("circle", { cx:60, cy:24, r:2.8, fill:"#1d1a17" }, cab);                       // ojo
  el("circle", { cx:61, cy:23, r:1, fill:"#fff" }, cab);
  el("circle", { cx:69, cy:30, r:2.4, fill:"#e58b8b" }, cab);                       // nariz
  el("circle", { cx:56, cy:29, r:5, fill:h.vientre, opacity:.0 }, cab);
  h.g = g; h.s = s; h.f = f;
  g.addEventListener("pointerdown", (ev) => arrastrar(ev, h));
  return g;
}

// ---- Movimiento ----
function pos(h) { return { x:h.x, y:h.y }; }
function pintaHam(h) {
  const dx = h.dir;
  h.f.setAttribute("transform", `translate(${h.x},${h.y}) scale(${dx},1)`);
  h.f.setAttribute("transform", `translate(${h.x},${h.y}) scale(${dx},1)`);
  h.g.setAttribute("opacity", h.oculto ? "0" : "1");
}

function vaA(h, x, y) {
  h.tx = x; h.ty = y;
  if (x < h.x) h.dir = -1; else if (x > h.x) h.dir = 1;
  h.g.classList.add("anda");
}

function aleatorio(h) {
  const enCasa = h.estado === "jaula";
  const r = enCasa ? JAULA : HABITACION;
  return { x: r.x0 + 20 + Math.random()*(r.x1-r.x0-100), y: r.y0 + 40 + Math.random()*(r.y1-r.y0-120) };
}

function ciclo(t) {
  // Necesidades y decisiones al azar cada 10–20 s
  for (const h of hams) {
    h.hambre = Math.max(0, h.hambre - 0.01);
    h.sed = Math.max(0, h.sed - 0.012);
    if (h.oculto) continue;
    if (!h.proxima || t > h.proxima) {
      h.proxima = t + 10000 + Math.random()*10000;
      if (h.estado === "jaula") {
        if (h.hambre < 35 && comida > 0) vaA(h, 90, JAULA.y1-60);
        else if (h.sed < 35 && agua > 0) vaA(h, JAULA.x1-30, JAULA.y0+70);
        else { const p = aleatorio(h); vaA(h, p.x, p.y); }
      } else { const p = aleatorio(h); vaA(h, p.x, p.y); }
    }
    if (h.tx != null) {
      const dx = h.tx - h.x, dy = h.ty - h.y, d = Math.hypot(dx, dy);
      if (d < 3) {
        h.tx = null; h.g.classList.remove("anda");
        if (h.estado === "jaula" && h.x < 120 && h.y > JAULA.y1-100 && comida > 0) { h.hambre = 100; comida = Math.max(0, comida-6); h.g.classList.add("come"); setTimeout(()=>h.g.classList.remove("come"), 1600); corazonEn(h.x+30,h.y-10); pintaComida(); }
        if (h.estado === "jaula" && h.x > JAULA.x1-60 && h.y < JAULA.y0+110 && agua > 0) { h.sed = 100; agua = Math.max(0, agua-8); corazonEn(h.x+30,h.y-10); }
      } else {
        const v = 1.7;
        h.x += dx/d*v; h.y += dy/d*v;
        if (dx !== 0) h.dir = dx > 0 ? 1 : -1;
      }
    }
    // Hamster escapado: se esconde tras 6 s
    if (h.estado === "habitacion" && !h.oculto && t - h.escapadoAt > 6000 && !h.tx && Math.random() < 0.02) {
      h.oculto = true; h.pista = t; h.escondidoY = h.y;
    }
    pintaHam(h);
  }
  // Pista a los 20 s escondido
  const f = document.getElementById("flecha");
  const e = hams.find(h => h.oculto && h.estado === "habitacion" && t - h.pista > 20000);
  if (f) f.setAttribute("visibility", e ? "visible" : "hidden");
  if (e && f) f.setAttribute("transform", `translate(0,${e.escondidoY-18})`);
  requestAnimationFrame(ciclo);
}

function pintaComida() {
  // se repinta la jaula para reflejar comida y agua
  capas.jaula.innerHTML = ""; dibujaJaulaContenido();
}

// ---- Interacción ----
function jugar(id) {
  const o = VARIANTES[variante].objetos[id];
  const h = hams.find(x => x.estado === "jaula" && !x.oculto) || hams[0];
  vaA(h, o.x + (id.startsWith("tubo") ? 20 : 40), o.y + (id.startsWith("tubo") ? -40 : 90));
  burbujaEn(h.x+30, h.y-6, SONIDO[id]);
  if (id === "rueda") document.getElementById("rueda")?.classList.add("rueda-gira");
  if (id === "columpio") { const c = document.getElementById("columpio"); c?.classList.remove("columpio-vaiven"); void c?.offsetWidth; c?.classList.add("columpio-vaiven"); }
  corazonEn(o.x + 40, o.y);
  aviso(`${h.nombre}: ${SONIDO[id]}`);
}

function esconderseEn(sitio) {
  const h = hams.find(x => x.estado === "habitacion" && !x.oculto);
  if (!h) return;
  h.oculto = true; h.pista = performance.now(); h.escondidoY = VARIANTES[variante][sitio === "cama" ? "cama" : "rascador"].y + 30;
  aviso(`${h.nombre} se ha escondido`);
}

function abrirPuerta() {
  puertaAbierta = !puertaAbierta;
  const hoja = document.getElementById("puertaHoja");
  if (hoja) hoja.setAttribute("transform", puertaAbierta ? "rotate(-70)" : "rotate(0)");
  if (puertaAbierta) {
    const h = hams[0];
    h.estado = "habitacion"; h.escapadoAt = performance.now(); h.oculto = false;
    h.x = PUERTA.x + 40; h.y = PUERTA.y + 40; h.tx = null;
    burbujaEn(h.x+30, h.y-6, "¡Ups!");
    aviso(`¡${h.nombre} se ha escapado!`);
  }
}

// Arrastrar un hamster: con el dedo, dentro del escenario
function arrastrar(ev, h) {
  if (h.estado !== "habitacion") return;
  ev.preventDefault();
  if (h.oculto) { h.oculto = false; h.pista = null; pintaHam(h); }
  const pt = (e) => { const m = svg.getScreenCTM().inverse(); const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(m); };
  const p0 = pt(ev); const ox = h.x, oy = h.y;
  h.g.classList.add("sale");
  const mueve = (e) => { const p = pt(e); h.x = ox + (p.x - p0.x); h.y = oy + (p.y - p0.y); h.dir = 1; pintaHam(h); };
  const suelta = () => {
    window.removeEventListener("pointermove", mueve); window.removeEventListener("pointerup", suelta);
    h.g.classList.remove("sale");
    const cx = (JAULA.x0+JAULA.x1)/2, cy = (JAULA.y0+JAULA.y1)/2;
    if (Math.hypot(h.x-cx, h.y-cy) < 160) {
      h.estado = "jaula"; h.x = 120 + Math.random()*120; h.y = 200 + Math.random()*120; h.tx = null;
      puertaAbierta = false; const hoja = document.getElementById("puertaHoja"); if (hoja) hoja.setAttribute("transform","rotate(0)");
      pintaHam(h);
      corazonEn(h.x+30, h.y-10);
      aviso(`${h.nombre} ha vuelto a la jaula`);
    }
  };
  window.addEventListener("pointermove", mueve);
  window.addEventListener("pointerup", suelta);
}

// ---- Construcción de la escena ----
let capas = {};
function construir() {
  svg.innerHTML = "";
  capas = {};
  for (const n of ["fondo","jaula","objetos","hams","efectos","flecha"]) capas[n] = el("g", { id:"capa-"+n }, svg);
  dibujaFondo();
  dibujaJaulaContenido();
  dibujaObjetos();
  dibujaEscondites();
  hams.forEach(h => { hamsterSVG(h); pintaHam(h); });
  // Flecha de pista
  const f = el("g", { id:"flecha", visibility:"hidden" }, capas.flecha);
  const fl = el("g", { class:"flecha" }, f);
  el("polygon", { points:"940,0 920,-14 920,14", fill:"#e8875b", stroke:"#8a4a2a", "stroke-width":2 }, fl);
  el("text", { x:900, y:5, "font-size":12, "text-anchor":"end", fill:"#8a4a2a", "font-weight":700 }, f).textContent = "¿Dónde está?";
  // Tiene que colgar de la flecha en el borde derecho
  f.setAttribute("transform", "translate(0,0)");
  etiqueta();
}

function dibujaJaulaContenido() {
  const cur = capas.jaula;
  if (cur) cur.innerHTML = "";
  dibujaJaula();
}

function etiqueta() {
  $("#etiqueta").textContent = `${variante} · ${VARIANTES[variante].nombre}`;
  const q = new URLSearchParams(location.search); q.set("variante", variante);
  history.replaceState(null, "", "?" + q.toString());
}

// ---- Eventos ----
$("#btnAbrir").addEventListener("click", abrirPuerta);
$("#btnComida").addEventListener("click", () => { comida = 100; pintaComida(); aviso("Comida puesta en el cuenco"); });
$("#btnAgua").addEventListener("click", () => { agua = 100; pintaComida(); aviso("Agua rellenada"); });
function cambiar(d) { const ks = Object.keys(VARIANTES); variante = ks[(ks.indexOf(variante)+d+ks.length)%ks.length]; hams.forEach(h => { h.tx = null; }); construir(); }
$("#prev").addEventListener("click", () => cambiar(-1));
$("#next").addEventListener("click", () => cambiar(1));
window.addEventListener("keydown", (e) => {
  if (e.target.matches("input, textarea, [contenteditable]")) return;
  if (e.key === "ArrowLeft") cambiar(-1);
  if (e.key === "ArrowRight") cambiar(1);
});

const q = new URLSearchParams(location.search).get("variante");
if (q && VARIANTES[q.toUpperCase()]) variante = q.toUpperCase();
construir();
requestAnimationFrame(ciclo);
</script>
