<title>PROTOTIPO — jaula de hamsters (#407)</title>
<!-- PROTOTIPO DESECHABLE para la ticket #407 de Mocheto/super-noa.
     Pregunta: cómo se ve y se mueve la jaula grande con laberinto de tubos.
     Tres recorridos con ?variante=A|B|C o con las flechas de abajo. -->
<style>
  :root { --bg:#f4ead8; --ink:#3b2f25; --hud:#fff8ec; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#241e1a; --ink:#f3e8d8; --hud:#3a322c; } }
  :root[data-theme="dark"] { --bg:#241e1a; --ink:#f3e8d8; --hud:#3a322c; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:system-ui,sans-serif; }

  svg#escena { width:min(100%,1280px); height:auto; border-radius:16px; box-shadow:0 8px 24px rgba(0,0,0,.18); touch-action:none; user-select:none; }

  #barra { position:fixed; bottom:10px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:10px; background:#2b2b2b; color:#fff; padding:6px 12px; border-radius:999px; font-size:14px; box-shadow:0 4px 16px rgba(0,0,0,.35); white-space:nowrap; }
  #barra button { background:#474747; color:#fff; border:0; border-radius:999px; width:34px; height:34px; cursor:pointer; }
  #barra span { min-width:190px; text-align:center; }
  .toca { cursor:pointer; }

      { a:"f1", b:"p1", c:AMARILLO, via:[[90,458],[90,155],[220,155],[220,260],[300,260]] },

};
const ESCONDITES = { cama:{ x:1000, nombre:"la cama" }, rascador:{ x:1110, nombre:"el rascador" }, caseta:{ x:1210, nombre:"la casita" } };

// ---- Estado ----
let variante = "A", V, caminos = [], capas = {}, cosas = {};
let comida = 100, agua = 100, puertaAbierta = false, ultimo = 0;
const hams = [
  { nombre:"Perla",  color:"#b8763b", claro:"#fff3e2", escala:1.18, oreja:7.5 },

// ---- Utilidades ----
function el(tag, attrs = {}, padre) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (padre) padre.appendChild(e);
  return e;
}
const azar = (a, b) => a + Math.random() * (b - a);
const elige = (l) => l[Math.floor(Math.random() * l.length)];
function aviso(t) { document.getElementById("aviso").textContent = t; }
let audio;
function suena(notas) {
  audio ||= new (window.AudioContext || window.webkitAudioContext)();
  notas.forEach((f, i) => {
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i * 0.09;
    o.type = "triangle"; o.frequency.value = f; o.connect(g).connect(audio.destination);
    g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    o.start(t); o.stop(t + 0.09);
  });
}
const SONIDO = { tubo:[500,700,900], rueda:[300,300,300,300,300], columpio:[600,800,600], casita:[220,180], comida:[400,520], agua:[900,1100] };

function brota(x, y, txt, color = "#e0506a") {
  const t = el("text", { x, y, "font-size":22, "font-weight":800, "text-anchor":"middle", fill:color, stroke:"#fff", "stroke-width":4, "paint-order":"stroke" }, capas.efectos);
  t.textContent = txt;
  t.animate([{ transform:"translateY(0)", opacity:1 }, { transform:"translateY(-30px)", opacity:0 }], { duration:1200, fill:"forwards" });
  setTimeout(() => t.remove(), 1200);
}

// Polilínea con esquinas redondeadas (los codos de los tubos)
function redondea(p, r = 42) {
  let d = `M${p[0]}`;
  for (let i = 1; i < p.length - 1; i++) {
    const [a, b, c] = [p[i-1], p[i], p[i+1]];
    const hacia = (q) => { const l = Math.hypot(q[0]-b[0], q[1]-b[1]), k = Math.min(r, l/2) / l; return [b[0]+(q[0]-b[0])*k, b[1]+(q[1]-b[1])*k]; };
    d += ` L${hacia(a)} Q${b} ${hacia(c)}`;
  }
  return d + ` L${p[p.length-1]}`;
}

// ---- Dibujo ----
function fondo() {
  el("rect", { width:1280, height:540, fill:"#fbf2e2" }, capas.fondo);
  for (let x = 0; x < 1280; x += 48) el("rect", { x, width:16, height:490, fill:"#f4e6cc" }, capas.fondo);
  el("rect", { y:490, width:1280, height:50, fill:"#d8b585" }, capas.fondo);
  el("rect", { y:486, width:1280, height:6, fill:"#bd9763" }, capas.fondo);
  const t = el("text", { x:1105, y:300, "text-anchor":"middle", "font-size":15, fill:"#9a8568" }, capas.fondo);
  t.textContent = "habitación (escondites)";
}

function jaulaDetras() {
  const { x0, y0, x1, y1 } = V.jaula, c = capas.jaula;
  el("rect", { x:x0, y:y0, width:x1-x0, height:y1-y0-30, fill:"#eaf6fc", opacity:.75 }, c);
  for (let x = x0; x <= x1; x += 16) el("line", { x1:x, y1:y0, x2:x, y2:y1-40, stroke:"#8cc4e6", "stroke-width":1.5 }, c);
  for (let y = y0; y < y1-40; y += 40) el("line", { x1:x0, y1:y, x2:x1, y2:y, stroke:"#8cc4e6", "stroke-width":1.5 }, c);
  // tejado
  const m = (x0+x1)/2;
  for (const [a, b] of [[x0,m],[m,x1]]) el("path", { d:`M${a-14},${y0+6} L${(a+b)/2},${y0-34} L${b+14},${y0+6}`, fill:"none", stroke:"#2f86c9", "stroke-width":7, "stroke-linejoin":"round" }, c);
  for (const [x, y, w] of V.plataformas) el("rect", { x, y, width:w, height:11, rx:5, fill:"#f59ac0", stroke:"#d96c9a", "stroke-width":2 }, c);
  for (const [a, b] of V.rampas) {
    const [xa, ya] = V.nodos[a], [xb, yb] = V.nodos[b];
    el("line", { x1:xa, y1:ya+17, x2:xb, y2:yb+17, stroke:"#2f86c9", "stroke-width":9, "stroke-linecap":"round" }, c);
    el("line", { x1:xa, y1:ya+17, x2:xb, y2:yb+17, stroke:"#a8dcf7", "stroke-width":9, "stroke-dasharray":"3 14" }, c);
  }
  el("rect", { x:x0-8, y:y1-45, width:x1-x0+16, height:45, rx:12, fill:"#3d9be0" }, c);
  el("rect", { x:x0, y:y1-45, width:x1-x0, height:10, fill:"#e7cb8f" }, c); // virutas
}

function dibujaCosas() {
  const c = capas.cosas, n = (k) => V.nodos[V.cosas[k]];
  cosas = {};
  const grupo = (k) => { const [x, y] = n(k); const g = el("g", { transform:`translate(${x},${y})`, class:"toca" }, c); g.addEventListener("pointerdown", () => llama(k)); return g; };
  // rueda
  let g = grupo("rueda");
  el("path", { d:"M-20,17 L0,-20 L20,17", fill:"none", stroke:"#6f4fa8", "stroke-width":6 }, g);
  el("circle", { cy:-20, r:40, fill:"#c9a9ee", opacity:.55, stroke:"#8a62c9", "stroke-width":7 }, g);
  cosas.rueda = el("g", {}, g);
  for (let a = 0; a < 8; a++) el("line", { x1:0, y1:-20, x2:36*Math.cos(a*Math.PI/4), y2:-20+36*Math.sin(a*Math.PI/4), stroke:"#8a62c9", "stroke-width":3 }, cosas.rueda);
  // casita (la fachada va delante del hamster)
  const [cx, cy] = n("casita");

  el("polygon", { points:"-40,-16 -22,-42 22,-42 40,-16", fill:"#2f86c9" }, g);
  el("path", { d:"M-12,17 L-12,2 Q0,-12 12,2 L12,17 Z", fill:"#5a3b25" }, g);
  cosas.casita = g;
  // columpio
  g = grupo("columpio");
  el("path", { d:"M-36,18 L-28,-58 L28,-58 L36,18", fill:"none", stroke:"#a9753f", "stroke-width":5 }, g);
  cosas.columpio = el("g", {}, g);
  el("path", { d:"M-20,15 L0,-56 L20,15", fill:"none", stroke:"#888", "stroke-width":2 }, cosas.columpio);
  el("rect", { x:-25, y:13, width:50, height:8, rx:4, fill:AMARILLO, stroke:"#c79512" }, cosas.columpio);
  // comedero
  g = grupo("comida");
  el("path", { d:"M-24,8 L24,8 L18,19 L-18,19 Z", fill:"#ff8a4c", stroke:"#c95f27", "stroke-width":2 }, g);
  cosas.grano = el("g", {}, g);

  cosas.agua = el("rect", { x:15, width:18, rx:5, fill:"#6cc4ee" }, g);
  el("path", { d:"M24,-14 L24,-6 L12,0", fill:"none", stroke:"#8d99a6", "stroke-width":5 }, g);
  // aviso de vacío
  cosas.sed = el("text", { x:24, y:-80, "font-size":22, "text-anchor":"middle" }, g); cosas.sed.textContent = "💧";
  cosas.hambre = el("text", { x:n("comida")[0], y:n("comida")[1]-22, "font-size":22, "text-anchor":"middle" }, c); cosas.hambre.textContent = "🌾";
}

function tubos() {
  caminos = [];
  for (const t of V.tubos) {
    const d = redondea([V.nodos[t.a], ...t.via, V.nodos[t.b]]);
    const g = el("g", { class:"toca" }, capas.tubos);
    const base = { d, fill:"none", "stroke-linejoin":"round" };
    el("path", { ...base, stroke:t.c, "stroke-width":46, opacity:.2 }, g);
    el("path", { ...base, stroke:"#fff", "stroke-width":36, opacity:.08 }, g);
    const p = el("path", { ...base, stroke:"transparent", "stroke-width":46 }, g);
    const largo = p.getTotalLength();
    // anillas de colores y brillo
    for (let s = 26; s < largo - 15; s += 54) {
      const a = p.getPointAtLength(s-1), b = p.getPointAtLength(s+1);
      const ang = Math.atan2(b.y-a.y, b.x-a.x) * 180 / Math.PI, m = p.getPointAtLength(s);
      el("rect", { x:-5, y:-25, width:10, height:50, rx:5, fill:t.c, opacity:.85, transform:`translate(${m.x},${m.y}) rotate(${ang})` }, g);
    }
    el("path", { ...base, stroke:"#fff", "stroke-width":4, opacity:.7, transform:"translate(-9,-11)" }, g);
    for (const k of [t.a, t.b]) el("circle", { cx:V.nodos[k][0], cy:V.nodos[k][1], r:24, fill:"none", stroke:t.c, "stroke-width":6 }, g);
    const camino = { a:t.a, b:t.b, tipo:"tubo", ruta:p, largo };
    caminos.push(camino);
    g.addEventListener("pointerdown", () => llamaTubo(camino));
  }
  for (const [tipo, lista] of [["andar", V.andar], ["andar", V.rampas]]) for (const [a, b] of lista) {
    const ruta = el("path", { d:`M${V.nodos[a]} L${V.nodos[b]}`, fill:"none" }, capas.fondo);
    caminos.push({ a, b, tipo, ruta, largo:ruta.getTotalLength() });
  }
  for (const k of V.cubos || []) {
    const [x, y] = V.nodos[k];
    el("rect", { x:x-36, y:y-36, width:72, height:72, rx:10, fill:"#fff", opacity:.35, stroke:"#b7c3cc", "stroke-width":3 }, capas.tubos);
    for (const [dx, dy, w, h, f] of [[-16,-41,32,10,ROJO],[-16,31,32,10,AZUL],[-41,-16,10,32,AMARILLO],[31,-16,10,32,AZUL]])
      el("rect", { x:x+dx, y:y+dy, width:w, height:h, rx:3, fill:f }, capas.tubos);
  }
}

  el("circle", { cx:px+38, cy:y1-92, r:6, fill:"#ff8a3d" }, cosas.puerta);
  cosas.puerta.addEventListener("pointerdown", abrir);

}

  const c = capas.fondo, f = capas.escondites;
  const toca = (k) => { const g = el("g", { class:"toca" }, f); g.addEventListener("pointerdown", (e) => descubre(k, e)); return g; };
  let g = toca("cama");
  el("ellipse", { cx:1000, cy:495, rx:58, ry:25, fill:"#e58f95", stroke:"#bf6670", "stroke-width":3 }, g);

  g = toca("rascador");
  el("rect", { x:1092, y:370, width:36, height:135, rx:6, fill:"#c49d69" }, g);

  g = toca("caseta");

  el("polygon", { points:"1162,458 1210,420 1258,458", fill:"#d1644f" }, g);
  el("path", { d:"M1196,510 L1196,488 Q1210,470 1224,488 L1224,510 Z", fill:"#6e4528" }, g);
}

// Hamster dibujado en el origen, mirando a la derecha
function dibujaHam(h) {
  h.g = el("g", { class:"toca" }, capas.hams);
  h.giro = el("g", {}, h.g);
  const s = el("g", { transform:`scale(${h.escala})` }, h.giro);
  h.cuerpo = el("g", {}, s);
  const c = h.cuerpo;
  el("circle", { cx:-23, cy:4, r:h.nombre === "Bolita" ? 3 : 5, fill:h.claro }, c);
  h.patas = [-12, 10].map((x) => el("ellipse", { cx:x, cy:15, rx:6, ry:3.5, fill:"#f0b4a4" }, c));
  el("ellipse", { cx:-3, cy:2, rx:22, ry:15, fill:h.color }, c);
  el("ellipse", { cx:0, cy:9, rx:16, ry:7.5, fill:h.claro }, c);
  for (const x of [11, 23]) {
    el("circle", { cx:x, cy:-15, r:h.oreja, fill:h.color }, c);
    el("circle", { cx:x, cy:-15, r:h.oreja*.55, fill:"#f2aea4" }, c);
  }
  el("circle", { cx:16, cy:-3, r:13, fill:h.color }, c);
  el("ellipse", { cx:21, cy:3, rx:9, ry:6.5, fill:h.claro }, c);
  el("circle", { cx:20, cy:-7, r:3, fill:"#1c1815" }, c);
  el("circle", { cx:21, cy:-8, r:1.1, fill:"#fff" }, c);
  el("circle", { cx:29, cy:0, r:2.2, fill:"#e0707c" }, c);
  h.g.addEventListener("pointerdown", (e) => tocaHam(h, e));
}

// ---- Movimiento por el laberinto ----
const vecinos = (n) => caminos.filter((c) => c.a === n || c.b === n);
function ruta(desde, hasta) { // búsqueda en anchura: lista de caminos
  const vistos = new Set([desde]), cola = [[desde, []]];
  while (cola.length) {
    const [n, pasos] = cola.shift();
    if (n === hasta) return pasos;
    for (const c of vecinos(n)) { const m = c.a === n ? c.b : c.a; if (!vistos.has(m)) { vistos.add(m); cola.push([m, [...pasos, c]]); } }
  }
  return [];
}
function empieza(h, camino) {
  h.camino = camino; h.s = 0; h.sentido = camino.a === h.nodo ? 1 : -1; h.hace = null;
  if (camino.tipo === "tubo") suena([520, 660]);
}
function cosaEn(n) { return Object.keys(V.cosas).find((k) => V.cosas[k] === n); }
function actividad(h, k, t) {
  if (hams.some((o) => o !== h && o.hace === k)) return false;
  if (k === "comida" && comida <= 0) return false;
  if (k === "agua" && agua <= 0) return false;
  h.hace = k; h.hasta = t + (k === "casita" ? 4000 : azar(3000, 6000));
  if (k === "comida") { comida -= 12; h.hambre = 100; }
  if (k === "agua") { agua -= 15; h.sed = 100; }
  brota(h.x, h.y - 40, { comida:"¡ñam!", agua:"glup", rueda:"¡yupi!", columpio:"¡hala!", casita:"zzz" }[k]);
  return true;
}
function decide(h, t) {
  const falta = h.hambre < 35 && comida > 0 ? "comida" : h.sed < 35 && agua > 0 ? "agua" : null;
  if (falta && !h.plan.length) {
    if (V.cosas[falta] === h.nodo) { if (actividad(h, falta, t)) return; }
    else h.plan = ruta(h.nodo, V.cosas[falta]);
  }
  if (h.plan.length) return empieza(h, h.plan.shift());
  const meta = h.meta; h.meta = null;
  if (meta && V.cosas[meta] === h.nodo && actividad(h, meta, t)) return;
  const k = cosaEn(h.nodo);
  if (k && k !== "comida" && k !== "agua" && Math.random() < .45 && actividad(h, k, t)) return;
  if (Math.random() < .1) { h.espera = t + azar(800, 2200); return; }
  let ops = vecinos(h.nodo).filter((c) => c !== h.camino);
  if (!ops.length) ops = vecinos(h.nodo);
  const tubosLibres = ops.filter((c) => c.tipo === "tubo");
  empieza(h, tubosLibres.length && Math.random() < .55 ? elige(tubosLibres) : elige(ops));
}

function coloca(h, x, y, ang, paso) {
  h.x = x; h.y = y;
  const izq = Math.cos(ang * Math.PI / 180) < -0.01;
  h.g.setAttribute("transform", `translate(${x},${y})`);
  h.giro.setAttribute("transform", `rotate(${ang}) scale(1,${izq ? -1 : 1})`);
  h.cuerpo.setAttribute("transform", `translate(0,${-Math.abs(Math.sin(paso)) * 2.5})`);
  h.patas.forEach((p, i) => p.setAttribute("cx", (i ? 10 : -12) + Math.sin(paso + i * Math.PI) * 4));
}

function enLaJaula(h, t, dt) {
  const [nx, ny] = V.nodos[h.nodo];
  if (h.hace) {
    const quieto = h.hace === "casita";
    if (h.hace === "rueda") { h.vueltas += dt * .4; coloca(h, nx, ny - 8, 0, t / 45); cosas.rueda.setAttribute("transform", `rotate(${-h.vueltas} 0 -20)`); }
    else if (h.hace === "columpio") { const a = Math.sin(t / 380) * 20; cosas.columpio.setAttribute("transform", `rotate(${a} 0 -56)`); coloca(h, nx - Math.sin(a*Math.PI/180)*60, ny - 8, a / 2, 0); }
    else if (quieto) coloca(h, nx, ny + (h.hasta - t < 1500 ? -6 : 2), 0, 0);
    else coloca(h, nx - 8, ny, h.hace === "comida" ? 10 + Math.sin(t / 90) * 8 : -12 + Math.sin(t / 130) * 4, 0);
    if (t > h.hasta) { h.hace = null; h.espera = t + 500; h.camino = null; }
    return;
  }
  if (h.espera > t) { coloca(h, nx, ny, h.mira, 0); return; }
  if (!h.andando) { decide(h, t); h.andando = !h.hace && !(h.espera > t); if (!h.andando) return; }
  const c = h.camino;
  h.s += dt * (c.tipo === "tubo" ? 0.11 : 0.065);
  const s = Math.min(h.s, c.largo), en = (v) => c.ruta.getPointAtLength(h.sentido > 0 ? v : c.largo - v);
  const p = en(s), a = en(Math.max(0, s - 3)), b = en(Math.min(c.largo, s + 3));
  const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
  coloca(h, p.x, p.y, ang, h.s / 7);
  h.mira = Math.cos(ang * Math.PI / 180) < 0 ? 180 : 0;
  if (h.s >= c.largo) { h.nodo = h.sentido > 0 ? c.b : c.a; h.andando = false; }
}

// ---- Escapada ----
function huye(h, t) {
  h.escondite = null; h.destino = elige(Object.keys(ESCONDITES)); h.correDesde = t;
}
function fuera(h, t, dt) {
  if (h.cogido || h.escondite) return;
  // corretea un poco antes de ir a esconderse
  const meta = t - h.correDesde < 3500 ? 920 + (Math.sin(t / 700) + 1) * 170 : ESCONDITES[h.destino].x;
  const dx = meta - h.x, paso = Math.sign(dx) * Math.min(Math.abs(dx), dt * 0.17);
  coloca(h, h.x + paso, h.y + (500 - h.y) * 0.12, dx < 0 ? 180 : 0, t / 40);
  if (t - h.correDesde > 4000 && Math.abs(dx) < 4) { h.escondite = h.destino; h.escondidoEn = t; h.g.setAttribute("visibility", "hidden"); aviso(`${h.nombre} se ha escondido… ¿dónde estará?`); }
}
function abrir() {
  const dentro = hams.filter((h) => !h.fuera);
  if (puertaAbierta || !dentro.length) { puertaAbierta = false; pintaPuerta(); return; }
  puertaAbierta = true; pintaPuerta();
  const h = elige(dentro);
  h.fuera = true; h.hace = null; h.plan = []; h.andando = false;
  [h.x, h.y] = cosas.salida;
  capas.libres.appendChild(h.g);
  huye(h, ultimo);
  suena([800, 600, 400]); brota(h.x, h.y - 40, "¡me escapo!");
  aviso(`¡${h.nombre} se ha escapado! Cógelo y arrástralo hasta la jaula.`);
}
function punto(e) { return new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse()); }
function coge(h, e) {
  e.preventDefault();
  h.cogido = true; h.escondite = null; h.g.setAttribute("visibility", "visible");
  const mueve = (ev) => { const p = punto(ev); coloca(h, p.x, p.y, 0, 0); };
  const suelta = () => {
    removeEventListener("pointermove", mueve); removeEventListener("pointerup", suelta);
    h.cogido = false;
    const j = V.jaula, d = Math.hypot(Math.max(j.x0 - h.x, 0, h.x - j.x1), Math.max(j.y0 - h.y, 0, h.y - j.y1));
    if (d <= 150) {
      h.fuera = false; h.nodo = V.cosas.columpio; h.camino = null; h.andando = false; h.espera = ultimo + 800;
      capas.hams.appendChild(h.g);
      if (!hams.some((o) => o.fuera)) { puertaAbierta = false; pintaPuerta(); }
      suena([500, 650, 800]); brota(...V.nodos[h.nodo], "♥");
      aviso(`${h.nombre} ha vuelto a la jaula.`);
    } else huye(h, ultimo);
  };
  mueve(e);
  addEventListener("pointermove", mueve); addEventListener("pointerup", suelta);
}
function descubre(k, e) {
  const h = hams.find((o) => o.fuera && o.escondite === k);
  if (h) coge(h, e);
}

// ---- Toques de Noa ----
function manda(meta, plan) {
  const h = elige(hams.filter((o) => !o.fuera && !o.hace)) || hams.find((o) => !o.fuera);
  if (!h) return null;
  const desde = h.andando ? (h.sentido > 0 ? h.camino.b : h.camino.a) : h.nodo;
  h.hace = null; h.espera = 0; h.meta = meta; h.plan = plan(desde);
  return h;
}
function llama(k) {
  suena(SONIDO[k]);
  if (k === "comida" && comida <= 20) return rellena("comida");
  if (k === "agua" && agua <= 20) return rellena("agua");
  const h = manda(k, (desde) => ruta(desde, V.cosas[k]));
  if (h) aviso(`${h.nombre} va hacia ${ { rueda:"la rueda", columpio:"el columpio", casita:"la casita", comida:"la comida", agua:"el agua" }[k] }.`);
}
function llamaTubo(c) {
  suena(SONIDO.tubo);
  const h = manda(null, (desde) => {
    const ida = ruta(desde, c.a), vuelta = ruta(desde, c.b);
    return [...(ida.length <= vuelta.length ? ida : vuelta).filter((x) => x !== c), c];
  });
  if (h) aviso(`${h.nombre} va a pasar por ese tubo.`);
}
function tocaHam(h, e) {
  if (h.fuera) return coge(h, e);
  suena([900, 1200]); brota(h.x, h.y - 30, `♥ ${h.nombre}`);
}
function rellena(k) {
  if (k === "comida") comida = 100; else agua = 100;
  suena(SONIDO[k]);
  aviso(k === "comida" ? "Comida puesta en el cuenco." : "Botella de agua llena.");
}

// ---- Bucle y construcción ----
function ciclo(t) {
  const dt = Math.min(50, t - ultimo); ultimo = t;
  for (const h of hams) {
    h.hambre -= dt * .0012; h.sed -= dt * .0014;
    h.g.style.opacity = h.hace === "casita" && h.hasta - t > 1500 ? 0 : 1;
    h.fuera ? fuera(h, t, dt) : enLaJaula(h, t, dt);
  }
  cosas.grano.setAttribute("opacity", comida > 5 ? 1 : 0);
  cosas.hambre.setAttribute("opacity", comida > 5 ? 0 : 1);
  cosas.sed.setAttribute("opacity", agua > 5 ? 0 : 1);
  const alto = 52 * Math.max(0, agua) / 100;
  cosas.agua.setAttribute("y", -17 - alto); cosas.agua.setAttribute("height", alto);
  const perdido = hams.find((h) => h.fuera && h.escondite && t - h.escondidoEn > 20000);
  cosas.flecha.setAttribute("visibility", perdido ? "visible" : "hidden");
  if (perdido) cosas.flecha.setAttribute("transform", `translate(${ESCONDITES[perdido.escondite].x},${320 + Math.sin(t / 200) * 8})`);
  requestAnimationFrame(ciclo);
}

function construir() {
  V = VARIANTES[variante];
  svg.innerHTML = ""; capas = {}; puertaAbierta = false;
  // orden de dibujo: el hamster queda detrás del plástico de los tubos
  for (const n of ["fondo","jaula","cosas","hams","delante","reja","puerta","tubos","escondites","libres","efectos"]) capas[n] = el("g", {}, svg);
  fondo(); jaulaDetras(); dibujaCosas(); tubos(); jaulaDelante(); habitacion();
  capas.reja.style.pointerEvents = "none"; capas.efectos.style.pointerEvents = "none";
  cosas.flecha = el("g", { visibility:"hidden" }, capas.efectos);
  el("polygon", { points:"-18,0 18,0 0,30", fill:"#ff8a3d", stroke:"#a04d12", "stroke-width":3 }, cosas.flecha);
  hams.forEach((h, i) => {
    Object.assign(h, { nodo: i ? "p1" : "f1", camino:null, plan:[], meta:null, andando:false, hace:null, espera:ultimo + i * 1500, mira:0, vueltas:0, fuera:false, cogido:false, escondite:null, hambre:60 + i * 20, sed:75 - i * 20 });
    dibujaHam(h);
  });
  document.getElementById("etiqueta").textContent = `${variante} · ${V.nombre}`;
  const q = new URLSearchParams(location.search); q.set("variante", variante);
  try { history.replaceState(null, "", "?" + q); } catch {}
}

document.getElementById("btnAbrir").addEventListener("click", abrir);
document.getElementById("btnComida").addEventListener("click", () => rellena("comida"));
document.getElementById("btnAgua").addEventListener("click", () => rellena("agua"));
function cambiar(d) { const k = Object.keys(VARIANTES); variante = k[(k.indexOf(variante) + d + k.length) % k.length]; construir(); }
document.getElementById("prev").addEventListener("click", () => cambiar(-1));
document.getElementById("next").addEventListener("click", () => cambiar(1));
addEventListener("keydown", (e) => { if (e.key === "ArrowLeft") cambiar(-1); if (e.key === "ArrowRight") cambiar(1); });

const inicial = (new URLSearchParams(location.search).get("variante") || "").toUpperCase();
if (VARIANTES[inicial]) variante = inicial;
construir();
requestAnimationFrame((t) => { ultimo = t; requestAnimationFrame(ciclo); });
</script>
</body>
